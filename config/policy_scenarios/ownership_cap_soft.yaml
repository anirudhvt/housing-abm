# Soft cap: over-cap bids are let through only at a rate that holds realised
# exceedance near the target share. No forced divestiture.
# See ownership_cap_hard.yaml on why the threshold is an absolute count.
- type: ownership_cap
  max_units_absolute: 5
  enforcement: soft
  soft_target_exceedance_fraction: 0.10
  soft_window_months: 12
  applies_to: [institutional]
